[project]
name = "finrag-agent"
version = "0.1.0"
description = "Production-style RAG Q&A agent over banking documents (LangChain v1, FastAPI, pgvector)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "numpy>=1.26",
    "fastembed>=0.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=3.0"]
eval = ["ragas>=0.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "fakeredis>=2.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"app/agent/prompts.py" = ["E501"]
